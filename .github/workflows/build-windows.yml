name: Build PS5 Stream Lite for Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Prepare Windows environment
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: git diffutils mingw-w64-x86_64-hidapi
          pacboy: >-
            ca-certificates:p
            cc:p
            cmake:p
            curl:p
            fast_float:p
            fftw:p
            
            json-c:p
            libevent:p
            lcms2:p
            libdovi:p
            meson:p
            miniupnpc:p
            gcc:p
            nasm:p
            ninja:p
            openssl:p
            opus:p
            pkgconf:p
            protobuf:p
            python:p
            python-psutil:p
            python-glad:p
            python-jinja:p
            python-pip:p
            qt6-base:p
            qt6-declarative:p
            qt6-svg:p
            shaderc:p
            speexdsp:p
            spirv-cross:p
            vulkan:p
            vulkan-headers:p

      - name: Download Chiaki-ng source
        run: |
          git clone --recurse-submodules https://github.com/chiaki-ng/chiaki-ng.git chiaki-ng

      - name: Install build tools
        working-directory: chiaki-ng
        run: |
          pip install protobuf
          pacman -S git make unzip zip --noconfirm

      - name: Build libplacebo
        working-directory: chiaki-ng
        run: scripts/build-libplacebo-windows.sh
        env:
          LIBPLACEBO_VERSION: 3be579e6c7f6b421d9ac3ab4860edc437c50b3eb

      - name: Install FFmpeg
        working-directory: chiaki-ng
        run: |
          curl -LO https://github.com/streetpea/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip
          unzip ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip
          cp -a ffmpeg-n7.1-latest-win64-gpl-shared-7.1/bin/. /mingw64/bin
          cp -a ffmpeg-n7.1-latest-win64-gpl-shared-7.1/include/. /mingw64/include
          cp -a ffmpeg-n7.1-latest-win64-gpl-shared-7.1/lib/. /mingw64/lib

      - name: Build SDL2
        working-directory: chiaki-ng
        run: |
          INSTALL_PREFIX=/mingw64 scripts/build-sdl2-compat.sh .
          cp /mingw64/lib/pkgconfig/sdl2-compat.pc /mingw64/lib/pkgconfig/sdl2.pc

      - name: Configure
        working-directory: chiaki-ng
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCHIAKI_ENABLE_CLI=OFF

      - name: Compile
        working-directory: chiaki-ng
        run: |
          cmake --build build --config Release --clean-first --target chiaki

      - name: Package portable version
        working-directory: chiaki-ng
        run: |
          ./scripts/deploy-windows-msys2.sh chiaki-ng-Win build/gui/chiaki.exe "${GITHUB_WORKSPACE}/chiaki-ng/build/third-party/cpp-steam-tools" /mingw64 gui/src/qml
          zip -r PS5-Stream-Lite-Windows.zip chiaki-ng-Win

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: PS5-Stream-Lite-Windows
          path: chiaki-ng/PS5-Stream-Lite-Windows.zip
          if-no-files-found: error
          retention-days: 7
